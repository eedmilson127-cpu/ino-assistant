<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>INO - Assistente Digital</title>
  <style>
    :root {
      --bg: #0c1118;
      --bg-2: #0a0f18;
      --text: #edf4ff;
      --muted: #9ba8b8;
      --cyan: #39d9ff;
      --cyan-2: #0dbedb;
      --green: #54e79a;
      --danger: #ff5b72;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(180deg, #06090f 0%, #0a1017 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: linear-gradient(180deg, #050a11 0%, #0b1220 100%);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,.5);
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow-y: auto;
    }

    .ino-face-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ino-face {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, rgba(31,170,208,0.34), rgba(11,17,26,0.6) 48%, rgba(4,7,13,0.9) 75%);
      border: 2px solid rgba(96,229,255,0.7);
      box-shadow:
        0 0 38px rgba(51,215,255,.38),
        0 0 90px rgba(31,198,235,.16),
        inset 0 0 24px rgba(58,237,255,.14),
        inset -15px -18px 30px rgba(0,0,0,.52),
        inset 16px 16px 30px rgba(38,213,245,.12);
      animation: pulseCore 4s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @keyframes pulseCore {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .ino-face.listening {
      animation: pulseCore 1.8s ease-in-out infinite;
    }

    .ino-face.processing {
      animation: pulseCore 0.9s ease-in-out infinite;
    }

    .ino-face.speaking {
      animation: pulseCore 0.5s ease-in-out infinite;
    }

    .ino-face.success {
      box-shadow: 0 0 40px rgba(84,231,154,.42), inset 0 0 24px rgba(84,231,154,.12), inset -15px -18px 30px rgba(0,0,0,.52), inset 16px 16px 30px rgba(84,231,154,.08);
    }

    .ino-face.error {
      box-shadow: 0 0 40px rgba(255,91,114,.42), inset 0 0 24px rgba(255,91,114,.12), inset -15px -18px 30px rgba(0,0,0,.52), inset 16px 16px 30px rgba(255,91,114,.08);
    }

    .ino-face::before {
      content: "";
      position: absolute;
      inset: 15px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(17,32,40,0.5), rgba(5,10,14,0.15) 60%, rgba(0,0,0,0));
      box-shadow: inset 0 0 22px rgba(255,255,255,0.04);
    }

    .eyes {
      position: absolute;
      width: 100px;
      display: flex;
      justify-content: space-between;
      z-index: 2;
    }

    .eye {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.96) 0%, rgba(198,215,224,0.65) 18%, rgba(11,16,22,0.96) 32%, rgba(10,12,17,1) 65%);
      box-shadow: inset 0 0 12px rgba(255,255,255,0.08), 0 0 16px rgba(46,214,255,0.25);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pupil {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(93,223,255,1) 0%, rgba(10,132,175,0.92) 38%, rgba(0,112,157,1) 100%);
      box-shadow: 0 0 20px rgba(38,209,255,0.6);
      transition: transform .14s ease-out;
      position: relative;
    }

    .pupil::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
    }

    .status-text {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 30px;
      min-height: 20px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(57,217,255,.9);
      margin-right: 6px;
      animation: blinkDot 1.8s infinite ease-in-out;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1); }
    }

    .chat-bubble {
      width: 100%;
      max-width: 340px;
      min-height: 80px;
      background: rgba(10, 16, 24, 0.12);
      border: 2px dashed rgba(255,255,255,0.35);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: rgba(255,255,255,0.9);
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
      margin-bottom: 30px;
      word-wrap: break-word;
      box-shadow: inset 0 0 18px rgba(255,255,255,0.04);
    }

    .input-section {
      width: 100%;
      padding: 0 20px 20px 20px;
      display: flex;
      gap: 10px;
    }

    .input-group {
      flex: 1;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(15,18,24,0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 10px 16px;
    }

    .input-group input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .input-group input::placeholder {
      color: rgba(255,255,255,0.38);
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      background: rgba(0, 212, 255, 0.2);
      transform: scale(1.1);
    }

    .btn-icon.send {
      background: linear-gradient(135deg, var(--cyan-2), var(--cyan));
      color: #071018;
      font-weight: bold;
    }

    .btn-icon.send:hover {
      box-shadow: 0 0 20px rgba(57,217,255,.5);
      transform: scale(1.12);
    }

    .btn-settings {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s ease;
      margin-left: 10px;
    }

    .btn-settings:hover {
      background: rgba(0, 212, 255, 0.2);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px);
      z-index: 1000;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: linear-gradient(135deg, var(--bg) 0%, #1a1f3a 100%);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 20px;
      width: 90%;
      max-width: 380px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 18px;
      color: var(--cyan);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text);
      font-size: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-close:hover {
      color: var(--cyan);
      transform: rotate(90deg);
    }

    .setting-group {
      margin-bottom: 16px;
    }

    .setting-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: block;
    }

    .setting-value {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 8px;
      font-size: 13px;
    }

    select {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0, 212, 255, 0.2);
      color: var(--text);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
    }

    select option {
      background: var(--bg);
      color: var(--text);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .btn-secondary:hover {
      background: rgba(0, 212, 255, 0.1);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan-2), var(--cyan));
      color: #051118;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
    }

    @media (max-width: 480px) {
      .app {
        max-width: 100vw;
      }

      .content {
        padding: 20px 15px;
      }

      .ino-face-container {
        width: 140px;
        height: 140px;
        margin-bottom: 25px;
      }

      .chat-bubble {
        font-size: 14px;
        min-height: 70px;
      }

      .input-section {
        padding: 0 15px 15px 15px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-title">INO</div>
    </div>

    <div class="content">
      <div class="ino-face-container">
        <div class="ino-face" id="inoFace">
          <div class="eyes">
            <div class="eye"><div class="pupil" id="pupilL"></div></div>
            <div class="eye"><div class="pupil" id="pupilR"></div></div>
          </div>
        </div>
      </div>

      <div class="status-text" id="statusText">
        <span class="status-dot"></span>
        <span>Pronto</span>
      </div>

      <div class="chat-bubble" id="chatBubble">
        Olá, Edmilson. Como posso ajudar?
      </div>
    </div>

    <div class="input-section">
      <div class="input-group">
        <input 
          id="messageInput" 
          type="text" 
          placeholder="Digite sua mensagem..."
          autocomplete="off"
        />
        <button class="btn-icon" id="micBtn" title="Voz">🎤</button>
        <button class="btn-icon send" id="sendBtn" title="Enviar">↑</button>
      </div>
      <button class="btn-settings" id="settingsBtn" title="Configurações">⚙️</button>
    </div>
  </div>

  <!-- MODAL DE CONFIGURAÇÕES -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Configurações</h3>
        <button class="modal-close" id="closeSettings">×</button>
      </div>

      <div class="setting-group">
        <label class="setting-label">Idioma</label>
        <select id="languageSelect">
          <option value="pt-BR">Português (Brasil)</option>
          <option value="en-US">English</option>
          <option value="es-ES">Español</option>
          <option value="fr-FR">Français</option>
          <option value="de-DE">Deutsch</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">Modo Visual</label>
        <select id="modeSelect">
          <option value="idle">Idle</option>
          <option value="listening">Listening</option>
          <option value="processing">Processing</option>
          <option value="speaking">Speaking</option>
          <option value="success">Success</option>
          <option value="error">Error</option>
        </select>
      </div>

      <div class="setting-group">
        <label class="setting-label">Volume</label>
        <div class="setting-value">
          <input type="range" id="volumeSlider" min="0" max="100" value="70" style="width: 100%; margin-right: 10px;">
          <span id="volumeValue">70%</span>
        </div>
      </div>

      <div class="setting-group">
        <label class="setting-label">Velocidade da Voz</label>
        <select id="speedSelect">
          <option value="0.75">Lenta</option>
          <option value="1" selected>Normal</option>
          <option value="1.25">Rápida</option>
          <option value="1.5">Muito Rápida</option>
        </select>
      </div>

      <div class="button-group">
        <button class="btn btn-secondary" id="clearBtn">Limpar</button>
        <button class="btn btn-primary" id="confirmBtn">Confirmar</button>
      </div>
    </div>
  </div>

  <script>
    // ===== CONFIGURAÇÕES GLOBAIS =====
    const app = {
      status: 'idle',
      language: 'pt-BR',
      volume: 70,
      speed: 1,
      userName: 'Edmilson',
      isListening: false,
      isSpeaking: false,
      requestInProgress: false,
      recognition: null,
      synthesis: null
    };

    // ===== ELEMENTOS DO DOM =====
    const inoFace = document.getElementById('inoFace');
    const pupilL = document.getElementById('pupilL');
    const pupilR = document.getElementById('pupilR');
    const statusText = document.getElementById('statusText');
    const chatBubble = document.getElementById('chatBubble');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettings = document.getElementById('closeSettings');
    const confirmBtn = document.getElementById('confirmBtn');
    const languageSelect = document.getElementById('languageSelect');
    const modeSelect = document.getElementById('modeSelect');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeValue = document.getElementById('volumeValue');
    const speedSelect = document.getElementById('speedSelect');
    const clearBtn = document.getElementById('clearBtn');

    // ===== FUNÇÕES DE ESTADO =====
    function setStatus(newStatus) {
      app.status = newStatus;
      inoFace.className = 'ino-face';
      
      if (newStatus !== 'idle') {
        inoFace.classList.add(newStatus);
      }

      const statusLabels = {
        'idle': 'Pronto',
        'listening': 'Ouvindo...',
        'processing': 'Processando...',
        'speaking': 'Falando...',
        'success': 'Sucesso',
        'error': 'Erro'
      };

      statusText.innerHTML = `<span class="status-dot"></span><span>${statusLabels[newStatus] || newStatus}</span>`;
    }

    function setBubble(text) {
      chatBubble.textContent = text;
    }

    // ===== MOVIMENTO DOS OLHOS =====
    function initEyeTracking() {
      document.addEventListener('mousemove', (e) => {
        const faceRect = inoFace.getBoundingClientRect();
        const centerX = faceRect.left + faceRect.width / 2;
        const centerY = faceRect.top + faceRect.height / 2;
        
        const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
        const distance = 10;
        
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;
        
        pupilL.style.transform = `translate(${x}px, ${y}px)`;
        pupilR.style.transform = `translate(${x}px, ${y}px)`;
      });
    }

    function initBlinking() {
      const blink = () => {
        setTimeout(() => {
          inoFace.style.opacity = '0.3';
          setTimeout(() => {
            inoFace.style.opacity = '1';
            blink();
          }, 140);
        }, 3000 + Math.random() * 4000);
      };
      blink();
    }

    // ===== VOZ =====
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      app.recognition = new SpeechRecognition();
      app.recognition.lang = app.language;
      app.recognition.continuous = false;
      app.recognition.interimResults = false;

      app.recognition.onstart = () => {
        app.isListening = true;
        setStatus('listening');
        setBubble('Ouvindo sua voz...');
      };

      app.recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        messageInput.value = transcript;
        app.isListening = false;
        handleSendMessage();
      };

      app.recognition.onerror = () => {
        setStatus('error');
        setBubble('Erro ao reconhecer a voz');
        app.isListening = false;
        setTimeout(() => setStatus('idle'), 2000);
      };

      app.recognition.onend = () => {
        app.isListening = false;
      };
    }

    function toggleMicrophone() {
      if (!app.recognition) {
        initSpeechRecognition();
      }
      if (!app.recognition) {
        setBubble('Microfone não suportado neste navegador');
        return;
      }

      if (app.isListening) {
        app.recognition.stop();
        setStatus('idle');
      } else {
        app.recognition.start();
      }
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = app.language;
      utterance.rate = app.speed;
      utterance.volume = app.volume / 100;

      utterance.onstart = () => {
        app.isSpeaking = true;
        setStatus('speaking');
      };

      utterance.onend = () => {
        app.isSpeaking = false;
        setStatus('idle');
      };

      utterance.onerror = () => {
        app.isSpeaking = false;
        setStatus('error');
      };

      window.speechSynthesis.speak(utterance);
    }

    // ===== LÓGICA DE IA =====
    function getLocalResponse(message) {
      const lower = message.toLowerCase();

      if (lower.includes('olá') || lower.includes('oi')) {
        return `Olá, ${app.userName}! Como posso ajudá-lo?`;
      }
      if (lower.includes('hora')) {
        return `Agora são ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
      }
      if (lower.includes('data')) {
        return `Hoje é ${new Date().toLocaleDateString('pt-BR')}`;
      }
      if (lower.includes('quem é você') || lower.includes('quem você é')) {
        return 'Sou o INO, seu assistente digital pessoal. Posso ajudá-lo com informações, comandos de voz e muito mais!';
      }
      if (lower.includes('obrigado')) {
        return 'De nada! Sempre feliz em ajudar. 😊';
      }
      if (lower.includes('qual é o seu nome')) {
        return 'Sou o INO, um assistente digital moderno e inteligente.';
      }

      return `Você disse: "${message}". Esta é uma versão demo do INO. Em breve estarei conectado a uma IA real para respostas mais inteligentes!`;
    }

    async function handleSendMessage() {
      const message = messageInput.value.trim();
      if (!message || app.requestInProgress) return;

      app.requestInProgress = true;
      messageInput.value = '';

      setStatus('processing');
      setBubble(`Você: ${message}`);

      setTimeout(async () => {
        try {
          // Tenta conexão com IA real (se disponível)
          let response;
          try {
            const result = await fetch('http://localhost:3000/api/ino', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                message: message,
                language: app.language
              })
            });
            const data = await result.json();
            response = data.reply || data.response || getLocalResponse(message);
          } catch (e) {
            // Se IA real não estiver disponível, usa resposta local
            response = getLocalResponse(message);
          }

          setBubble(response);
          setStatus('success');
          speakText(response);

          setTimeout(() => setStatus('idle'), 2000);
        } catch (error) {
          setBubble('Desculpe, não consegui processar sua mensagem.');
          setStatus('error');
          setTimeout(() => setStatus('idle'), 2000);
        }
        
        app.requestInProgress = false;
      }, 600);
    }

    // ===== EVENT LISTENERS =====
    sendBtn.addEventListener('click', handleSendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSendMessage();
    });

    micBtn.addEventListener('click', toggleMicrophone);

    settingsBtn.addEventListener('click', () => {
      settingsModal.classList.add('open');
    });

    closeSettings.addEventListener('click', () => {
      settingsModal.classList.remove('open');
    });

    confirmBtn.addEventListener('click', () => {
      app.language = languageSelect.value;
      app.volume = parseInt(volumeSlider.value);
      app.speed = parseFloat(speedSelect.value);
      
      if (app.recognition) {
        app.recognition.lang = app.language;
      }

      setBubble('Configurações atualizadas! ✓');
      settingsModal.classList.remove('open');
    });

    languageSelect.addEventListener('change', (e) => {
      app.language = e.target.value;
      if (app.recognition) {
        app.recognition.lang = e.target.value;
      }
    });

    modeSelect.addEventListener('change', (e) => {
      setStatus(e.target.value);
    });

    volumeSlider.addEventListener('input', (e) => {
      app.volume = parseInt(e.target.value);
      volumeValue.textContent = e.target.value + '%';
    });

    speedSelect.addEventListener('change', (e) => {
      app.speed = parseFloat(e.target.value);
    });

    clearBtn.addEventListener('click', () => {
      messageInput.value = '';
      setBubble('Olá, ' + app.userName + '. Como posso ajudar?');
      setStatus('idle');
    });

    // ===== INICIALIZAÇÃO =====
    function init() {
      setStatus('idle');
      setBubble(`Olá, ${app.userName}. Como posso ajudar?`);
      initEyeTracking();
      initBlinking();
      initSpeechRecognition();
      
      // Restaurar configurações se existirem
      const savedLang = localStorage.getItem('ino_language');
      if (savedLang) {
        app.language = savedLang;
        languageSelect.value = savedLang;
      }
    }

    init();
  </script>
</body>
</html>
